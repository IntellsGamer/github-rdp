name: CI-RDP-Windows

on:
    workflow_dispatch:
        inputs:
            install_chrome:
                description: "Install Google Chrome"
                type: boolean
                default: true
            install_7zip:
                description: "Install 7-Zip"
                type: boolean
                default: true
            install_notepadpp:
                description: "Install Notepad++"
                type: boolean
                default: true
            install_everything:
                description: "Install Everything Search"
                type: boolean
                default: true
            install_winrar:
                description: "Install WinRAR"
                type: boolean
                default: true
            install_vscode:
                description: "Install VS Code"
                type: boolean
                default: true
            install_anydesk:
                description: "Install AnyDesk"
                type: boolean
                default: true
            install_ffmpeg:
                description: "Install FFmpeg"
                type: boolean
                default: true
            install_vlc:
                description: "Install VLC Player"
                type: boolean
                default: true
            install_opencode:
                description: "Install OpenCode AI Agent"
                type: boolean
                default: true
            install_kilocli:
                description: "Install Kilo CLI"
                type: boolean
                default: true
            install_sysinternals:
                description: "Install Sysinternals Suite"
                type: boolean
                default: false
            remove_browser_policies:
                description: "Remove Browser Organization Policies"
                type: boolean
                default: true
            set_py_default_3_12:
                description: "Set default python 'py' launcher to 3.12"
                type: boolean
                default: true
            install_ghostery:
                description: "Install Ghostery Extension for Chrome"
                type: boolean
                default: false
            install_wsl:
                description: "Install WSL"
                type: boolean
                default: true
            configure_power:
                description: "Configure Power and Sleep Settings"
                type: boolean
                default: true
            configure_desktop:
                description: "Configure Desktop Icons and Settings"
                type: boolean
                default: true
            disable_win11_context:
                description: "Disable Windows 11 Context Menu"
                type: boolean
                default: true
            configure_appearance:
                description: "Configure Windows Appearance and Performance"
                type: boolean
                default: true
            disable_telemetry:
                description: "Disable Telemetry and Services"
                type: boolean
                default: true
            disable_search_index:
                description: "Disable Windows Search Indexing"
                type: boolean
                default: true
            disable_onedrive:
                description: "Disable OneDrive"
                type: boolean
                default: true
            legitimate_use_case:
                description: "Select your legitimate use case"
                type: choice
                options:
                    - "Debugging Windows-specific build failure"
                    - "Testing GUI application in GitHub runner environment"
                    - "Validating complex build scripts interactively"
                    - "Investigating CI/CD pipeline error"
                    - "Other legitimate development purpose"
                default: "Other legitimate development purpose"
                required: false
            use_case_description:
                description: "Briefly describe your debugging scenario (max 200 chars)"
                type: string
                default: "testing"
                required: false

jobs:
    build:
        runs-on: windows-latest
        timeout-minutes: 9999

        steps:
            - name: Install Applications (Chrome, 7-Zip, Notepad++, Everything, WinRAR, VS Code, AnyDesk, FFmpeg, VLC)
              if: inputs.install_chrome || inputs.install_7zip || inputs.install_notepadpp || inputs.install_everything || inputs.install_winrar || inputs.install_vscode || inputs.install_anydesk || inputs.install_ffmpeg || inputs.install_vlc
              shell: pwsh
              run: |
                    $apps = @()
                    if ('${{ inputs.install_chrome }}' -eq 'true') { $apps += "googlechrome" }
                    if ('${{ inputs.install_7zip }}' -eq 'true') { $apps += "7zip" }
                    if ('${{ inputs.install_notepadpp }}' -eq 'true') { $apps += "notepadplusplus" }
                    if ('${{ inputs.install_everything }}' -eq 'true') { $apps += "everything" }
                    if ('${{ inputs.install_winrar }}' -eq 'true') { $apps += "winrar" }
                    if ('${{ inputs.install_vscode }}' -eq 'true') { $apps += "vscode" }
                    if ('${{ inputs.install_anydesk }}' -eq 'true') { $apps += "anydesk" }
                    if ('${{ inputs.install_ffmpeg }}' -eq 'true') { $apps += "ffmpeg" }
                    if ('${{ inputs.install_vlc }}' -eq 'true') { $apps += "vlc" }

                    if ($apps.Count -gt 0) {
                        foreach ($app in $apps) {
                            Write-Host "Installing $app..."
                            choco install $app -y
                            if ($LASTEXITCODE -ne 0) {
                                Write-Host "⚠️ Failed to install $app"
                            }
                        }
                        Start-Sleep -Seconds 5

                        if ('${{ inputs.install_chrome }}' -eq 'true') {
                            $shell = New-Object -ComObject Shell.Application
                            $path = "C:\Program Files\Google\Chrome\Application\chrome.exe"
                            if (Test-Path $path) {
                                $shell.Namespace(0).ParseName($path).InvokeVerb("taskbarpin")
                            }
                        }

                        if ('${{ inputs.install_vscode }}' -eq 'true') {
                            $vscodePath = "C:\Program Files\Microsoft VS Code\Code.exe"
                            if (Test-Path $vscodePath) {
                                $shell = New-Object -ComObject Shell.Application
                                $shell.Namespace(0).ParseName($vscodePath).InvokeVerb("taskbarpin")
                            }
                        }

                        Write-Host "✅ Selected applications installed and pinned to taskbar"
                    } else {
                        Write-Host "ℹ️ No applications selected for installation"
                    }

            - name: Install OpenCode AI
              if: inputs.install_opencode
              run: |
                    npm i -g opencode-ai
                    Write-Host "✅ OpenCode installed"

            - name: Install Kilo CLI
              if: inputs.install_kilocli
              run: |
                    npm install -g @kilocode/cli
                    Write-Host "✅ Kilo CLI installed"
            
            - name: Install Sysinternals Suite
              if: inputs.install_sysinternals
              run: |
                    choco install sysinternals -y
                    Write-Host "✅ Sysinternals Suite installed"

            - name: Remove All Browser Organization Policies
              if: inputs.remove_browser_policies
              shell: powershell
              run: |
                    $browserPolicies = @(
                        "HKLM:\SOFTWARE\Policies\Google\Chrome",
                        "HKCU:\SOFTWARE\Policies\Google\Chrome",
                        "HKLM:\SOFTWARE\Policies\Microsoft\Edge",
                        "HKCU:\SOFTWARE\Policies\Microsoft\Edge",
                        "HKLM:\SOFTWARE\Policies\Mozilla\Firefox",
                        "HKCU:\SOFTWARE\Policies\Mozilla\Firefox",
                        "HKLM:\SOFTWARE\Policies\BraveSoftware\Brave",
                        "HKCU:\SOFTWARE\Policies\BraveSoftware\Brave",
                        "HKLM:\SOFTWARE\Policies\Vivaldi",
                        "HKCU:\SOFTWARE\Policies\Vivaldi"
                    )

                    foreach ($path in $browserPolicies) {
                        if (Test-Path $path) {
                            Remove-Item -Path $path -Recurse -Force
                            Write-Host "Successfully un-managed: $path"
                        }
                    }

                    Stop-Process -Name explorer -Force -ErrorAction SilentlyContinue
                    Write-Host "All browser enterprise configurations cleared!"

            - name: Install Ghostery Extension for Chrome
              if: inputs.install_ghostery
              run: |
                    try {
                        $chromePath = "C:\Program Files\Google\Chrome\Application\chrome.exe"
                        if (Test-Path $chromePath) {
                            $extensionUrl = "https://clients2.google.com/service/update2/crx?response=redirect&os=win&arch=x64&os_arch=x86_64&nacl_arch=x86-64&prod=chromecrx&prodchannel=stable&prodversion=120.0.6099.216&lang=en-US&acceptformat=crx3&x=id%3Dmlomiejdfkolichcflejclcbmpeaniij%26uc"
                            $crxPath = "$env:TEMP\ghostery.crx"
                            Invoke-WebRequest -Uri $extensionUrl -OutFile $crxPath -ErrorAction Stop

                            $profilePath = "$env:LOCALAPPDATA\Google\Chrome\User Data\Default"
                            $extensionsPath = "$profilePath\Extensions\mlomiejdfkolichcflejclcbmpeaniij"
                            New-Item -Path $extensionsPath -ItemType Directory -Force | Out-Null

                            $tempExtractPath = "$env:TEMP\ghostery_extract"
                            New-Item -Path $tempExtractPath -ItemType Directory -Force | Out-Null

                            $sevenZip = "C:\Program Files\7-Zip\7z.exe"
                            if (Test-Path $sevenZip) {
                                & $sevenZip x $crxPath -o"$tempExtractPath" -y | Out-Null
                                Copy-Item -Path "$tempExtractPath\*" -Destination $extensionsPath -Recurse -Force
                                Remove-Item -Path $tempExtractPath -Recurse -Force -ErrorAction SilentlyContinue
                                Remove-Item -Path $crxPath -Force -ErrorAction SilentlyContinue
                                Write-Host "✅ Ghostery extension installed"
                            }
                        }
                    }
                    catch {
                        Write-Host "⚠️ Could not install Ghostery extension: $_"
                    }

            - name: Install WSL
              if: inputs.install_wsl
              run: |
                    dism.exe /online /enable-feature /featurename:Microsoft-Windows-Subsystem-Linux /all /norestart
                    dism.exe /online /enable-feature /featurename:VirtualMachinePlatform /all /norestart
                    wsl --set-default-version 2
                    Write-Host "✅ WSL installed successfully"

            - name: Install OpenSSH Server
              run: |
                    Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
                    Start-Service sshd
                    Set-Service -Name sshd -StartupType 'Automatic'
                    Write-Host "✅ OpenSSH installed and started"

            - name: Configure Firewall for SSH and RDP
              run: |
                    Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
                    $ruleExists = Get-NetFirewallRule -Name "OpenSSH-Server-In-TCP" -ErrorAction SilentlyContinue
                    if (-not $ruleExists) {
                        New-NetFirewallRule -Name "OpenSSH-Server-In-TCP" -DisplayName "OpenSSH Server (sshd)" -Enabled True -Direction Inbound -Protocol TCP -Action Allow -LocalPort 22
                        Write-Host "✅ SSH firewall rule created"
                    } else {
                        Write-Host "✅ SSH firewall rule already exists"
                    }

                    $iisRuleExists = Get-NetFirewallRule -Name "IIS-HTTP-In-TCP" -ErrorAction SilentlyContinue
                    if (-not $iisRuleExists) {
                        New-NetFirewallRule -Name "IIS-HTTP-In-TCP" -DisplayName "IIS HTTP" -Enabled True -Direction Inbound -Protocol TCP -Action Allow -LocalPort 80
                        Write-Host "✅ IIS HTTP firewall rule created"
                    }
                    
                    # Firewall rules for noVNC (port 6080) and SSH Web (port 8080)
                    New-NetFirewallRule -Name "noVNC-In-TCP" -DisplayName "noVNC Web Port" -Enabled True -Direction Inbound -Protocol TCP -Action Allow -LocalPort 6080
                    New-NetFirewallRule -Name "SSHWeb-In-TCP" -DisplayName "SSH Web Port" -Enabled True -Direction Inbound -Protocol TCP -Action Allow -LocalPort 8080
                    New-NetFirewallRule -Name "Netcat-Shutdown-In-TCP" -DisplayName "Netcat Shutdown Control" -Enabled True -Direction Inbound -Protocol TCP -Action Allow -LocalPort 2266
                    
                    Write-Host "✅ Firewall rules configured"

            - name: Install noVNC and WebSSH2 with Authentication
              env:
                  RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
              run: |
                    # Install Node.js dependencies
                    npm install -g http-server websockify ws

                    # Create directory for web services
                    mkdir C:\web-services
                    cd C:\web-services

                    # Download noVNC
                    Invoke-WebRequest -Uri "https://github.com/novnc/noVNC/archive/refs/tags/v1.4.0.zip" -OutFile "novnc.zip"
                    Expand-Archive -Path "novnc.zip" -DestinationPath "."
                    Move-Item -Path ".\noVNC-1.4.0\*" -Destination ".\novnc" -Force
                    Remove-Item -Path ".\noVNC-1.4.0" -Recurse -Force
                    Remove-Item -Path ".\novnc.zip" -Force

                    # Download websockify for noVNC
                    Invoke-WebRequest -Uri "https://github.com/novnc/websockify/archive/refs/tags/v0.12.0.zip" -OutFile "websockify.zip"
                    Expand-Archive -Path "websockify.zip" -DestinationPath "."
                    Move-Item -Path ".\websockify-0.12.0\*" -Destination ".\websockify" -Force
                    Remove-Item -Path ".\websockify-0.12.0" -Recurse -Force
                    Remove-Item -Path ".\websockify.zip" -Force

                    # Store RDP password for services (masked from logs)
                    $password = $env:RDP_PASSWORD
                    $password | Out-File -FilePath "C:\web-services\password.txt" -Encoding ASCII

                    # Create password-protected noVNC HTML
                    $novncHtml = @"
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <title>noVNC with Authentication</title>
                        <script>
                            function authenticate() {
                                var password = document.getElementById('password').value;
                                var xhr = new XMLHttpRequest();
                                xhr.open('POST', '/auth', false);
                                xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
                                xhr.send('password=' + encodeURIComponent(password));
                                if (xhr.status === 200) {
                                    document.getElementById('authForm').style.display = 'none';
                                    document.getElementById('vncContainer').style.display = 'block';
                                    loadVNC();
                                } else {
                                    alert('Invalid password!');
                                }
                            }
                            function loadVNC() {
                                var iframe = document.createElement('iframe');
                                iframe.src = 'http://localhost:6080/vnc.html?host=localhost&port=6080';
                                iframe.style.width = '100%';
                                iframe.style.height = '100%';
                                iframe.style.border = 'none';
                                document.getElementById('vncContainer').appendChild(iframe);
                            }
                        </script>
                        <style>
                            body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #1a1a2e; color: #eee; }
                            #authForm { max-width: 400px; margin: 100px auto; padding: 30px; background: #16213e; border-radius: 10px; }
                            input { width: 100%; padding: 10px; margin: 10px 0; background: #0f3460; color: #eee; border: none; border-radius: 5px; }
                            button { width: 100%; padding: 10px; background: #e94560; color: white; border: none; border-radius: 5px; cursor: pointer; }
                            button:hover { background: #c73e54; }
                            #vncContainer { width: 100vw; height: 100vh; display: none; }
                            h2 { text-align: center; }
                        </style>
                    </head>
                    <body>
                        <div id="authForm">
                            <h2>🔐 Authentication Required</h2>
                            <p>Enter password to access VNC</p>
                            <input type="password" id="password" placeholder="Enter password" />
                            <button onclick="authenticate()">Connect</button>
                        </div>
                        <div id="vncContainer"></div>
                    </body>
                    </html>
                    "@
                    $novncHtml | Out-File -FilePath "C:\web-services\index.html" -Encoding UTF8

                    Write-Host "✅ noVNC installed with authentication"

            - name: Create SSH Web Interface with Authentication
              env:
                  RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
              run: |
                    # Store RDP password for SSH service
                    $password = $env:RDP_PASSWORD
                    $password | Out-File -FilePath "C:\web-services\sshpassword.txt" -Encoding ASCII

                    # Create SSH web server with authentication
                    $sshWebHtml = @"
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <title>SSH Web Client</title>
                        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/xterm.min.css">
                        <script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/xterm.min.js"></script>
                        <script src="https://cdnjs.cloudflare.com/ajax/libs/xterm-addon-fit/0.8.0/xterm-addon-fit.min.js"></script>
                        <style>
                            body { margin: 0; padding: 20px; background: #1a1a2e; font-family: Arial, sans-serif; }
                            #authForm { max-width: 400px; margin: 100px auto; padding: 30px; background: #16213e; border-radius: 10px; color: #eee; }
                            #terminalContainer { display: none; width: 100vw; height: 100vh; }
                            input { width: 100%; padding: 10px; margin: 10px 0; background: #0f3460; color: #eee; border: none; border-radius: 5px; }
                            button { width: 100%; padding: 10px; background: #e94560; color: white; border: none; border-radius: 5px; cursor: pointer; }
                            button:hover { background: #c73e54; }
                            h2 { text-align: center; }
                            #terminal { height: 90vh; }
                        </style>
                    </head>
                    <body>
                        <div id="authForm">
                            <h2>🔐 SSH Authentication Required</h2>
                            <p>Enter password to access SSH</p>
                            <input type="password" id="sshPassword" placeholder="Enter password" />
                            <button onclick="authenticateSSH()">Connect to SSH</button>
                        </div>
                        <div id="terminalContainer">
                            <div id="terminal"></div>
                        </div>
                        <script>
                            function authenticateSSH() {
                                var password = document.getElementById('sshPassword').value;
                                var xhr = new XMLHttpRequest();
                                xhr.open('POST', '/sshauth', false);
                                xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
                                xhr.send('password=' + encodeURIComponent(password));
                                if (xhr.status === 200) {
                                    document.getElementById('authForm').style.display = 'none';
                                    document.getElementById('terminalContainer').style.display = 'block';
                                    connectSSH();
                                } else {
                                    alert('Invalid password!');
                                }
                            }
                            function connectSSH() {
                                const term = new Terminal();
                                const fitAddon = new FitAddon.FitAddon();
                                term.loadAddon(fitAddon);
                                term.open(document.getElementById('terminal'));
                                fitAddon.fit();
                                term.writeln('\x1b[1;32mConnected to SSH Server\x1b[0m');
                                term.writeln('Type your SSH commands below...');
                                term.writeln('Example: ssh runneradmin@localhost');
                                
                                const ws = new WebSocket('ws://localhost:8080/ssh');
                                ws.onopen = function() {
                                    term.writeln('\x1b[1;32mWebSocket connected!\x1b[0m');
                                };
                                ws.onmessage = function(e) {
                                    term.write(e.data);
                                };
                                ws.onerror = function(e) {
                                    term.writeln('\x1b[1;31mWebSocket error\x1b[0m');
                                };
                                ws.onclose = function() {
                                    term.writeln('\x1b[1;31mWebSocket closed\x1b[0m');
                                };
                                
                                term.onData(function(data) {
                                    ws.send(data);
                                });
                            }
                        </script>
                    </body>
                    </html>
                    "@
                    $sshWebHtml | Out-File -FilePath "C:\web-services\ssh.html" -Encoding UTF8

                    Write-Host "✅ SSH Web interface created"

            - name: Create Netcat Shutdown Server with Password
              env:
                  RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
              run: |
                    # Store RDP password for shutdown service (cleanly)
                    $password = $env:RDP_PASSWORD
                    # Remove any trailing whitespace or newlines
                    $password = $password.Trim()
                    $password | Out-File -FilePath "C:\web-services\shutdownpassword.txt" -Encoding ASCII -NoNewline

                    # Create PowerShell script for netcat shutdown server
                    $ncScript = @'
                    param($Port = 2266, $PasswordFile = "C:\web-services\shutdownpassword.txt")
                    
                    # Read shutdown password and clean it
                    $shutdownPass = (Get-Content -Path $PasswordFile -Raw).Trim()
                    
                    Write-Host "Shutdown server running on port $Port"
                    Write-Host "Password loaded (length: $($shutdownPass.Length))"
                    
                    # Create listener
                    $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Any, $Port)
                    $listener.Start()
                    Write-Host "Listening on port $Port..."
                    
                    while ($true) {
                        try {
                            $client = $listener.AcceptTcpClient()
                            $stream = $client.GetStream()
                            $writer = New-Object System.IO.StreamWriter($stream)
                            $reader = New-Object System.IO.StreamReader($stream)
                            
                            # Send password prompt
                            $writer.WriteLine("Enter shutdown password:")
                            $writer.Flush()
                            
                            # Read password attempt and clean it
                            $attempt = $reader.ReadLine()
                            if ($attempt) {
                                $attempt = $attempt.Trim()
                            }
                            
                            Write-Host "Password attempt received (length: $($attempt.Length))"
                            Write-Host "Expected password length: $($shutdownPass.Length)"
                            
                            if ($attempt -eq $shutdownPass) {
                                $writer.WriteLine("Password correct! Shutting down...")
                                $writer.Flush()
                                Start-Sleep -Seconds 1
                                
                                # Trigger shutdown
                                [System.IO.File]::WriteAllText("C:\Users\runneradmin\Documents\stopmachine", "")
                                
                                $writer.WriteLine("Shutdown initiated!")
                                $writer.Flush()
                                Write-Host "✅ Shutdown triggered successfully!"
                            } else {
                                $writer.WriteLine("Invalid password! Connection closed.")
                                $writer.Flush()
                                Write-Host "❌ Invalid password attempt"
                            }
                            
                            $client.Close()
                        } catch {
                            Write-Host "Error: $_"
                        }
                    }
                    '@
                    $ncScript | Out-File -FilePath "C:\web-services\nc-server.ps1" -Encoding ASCII

                    Write-Host "✅ Netcat shutdown server created on port 2266"

            - name: Install noVNC and WebSSH2 with Authentication
              env:
                  RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
              run: |
                    # Install Node.js dependencies
                    npm install -g http-server websockify ws

                    # Create directory for web services
                    mkdir C:\web-services
                    cd C:\web-services

                    # Download noVNC
                    Invoke-WebRequest -Uri "https://github.com/novnc/noVNC/archive/refs/tags/v1.4.0.zip" -OutFile "novnc.zip"
                    Expand-Archive -Path "novnc.zip" -DestinationPath "."
                    Move-Item -Path ".\noVNC-1.4.0\*" -Destination ".\novnc" -Force
                    Remove-Item -Path ".\noVNC-1.4.0" -Recurse -Force
                    Remove-Item -Path ".\novnc.zip" -Force

                    # Download websockify for noVNC
                    Invoke-WebRequest -Uri "https://github.com/novnc/websockify/archive/refs/tags/v0.12.0.zip" -OutFile "websockify.zip"
                    Expand-Archive -Path "websockify.zip" -DestinationPath "."
                    Move-Item -Path ".\websockify-0.12.0\*" -Destination ".\websockify" -Force
                    Remove-Item -Path ".\websockify-0.12.0" -Recurse -Force
                    Remove-Item -Path ".\websockify.zip" -Force

                    # Store RDP password for services (masked from logs)
                    $password = $env:RDP_PASSWORD
                    $password | Out-File -FilePath "C:\web-services\password.txt" -Encoding ASCII

                    # Create password-protected noVNC HTML with correct WebSocket path
                    $novncHtml = @"
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <title>noVNC with Authentication</title>
                        <style>
                            body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #1a1a2e; color: #eee; }
                            #authForm { max-width: 400px; margin: 100px auto; padding: 30px; background: #16213e; border-radius: 10px; }
                            input { width: 100%; padding: 10px; margin: 10px 0; background: #0f3460; color: #eee; border: none; border-radius: 5px; }
                            button { width: 100%; padding: 10px; background: #e94560; color: white; border: none; border-radius: 5px; cursor: pointer; }
                            button:hover { background: #c73e54; }
                            #vncContainer { width: 100vw; height: 100vh; display: none; }
                            h2 { text-align: center; }
                        </style>
                    </head>
                    <body>
                        <div id="authForm">
                            <h2>🔐 Authentication Required</h2>
                            <p>Enter password to access VNC</p>
                            <input type="password" id="password" placeholder="Enter password" />
                            <button onclick="authenticate()">Connect</button>
                        </div>
                        <div id="vncContainer"></div>
                        <script>
                            var correctPassword = '$password';
                            
                            function authenticate() {
                                var password = document.getElementById('password').value;
                                if (password === correctPassword) {
                                    document.getElementById('authForm').style.display = 'none';
                                    document.getElementById('vncContainer').style.display = 'block';
                                    loadVNC();
                                } else {
                                    alert('Invalid password!');
                                }
                            }
                            
                            function loadVNC() {
                                var script = document.createElement('script');
                                script.src = 'app/ui.js';
                                script.onload = function() {
                                    // Initialize noVNC with correct WebSocket path
                                    var host = window.location.hostname;
                                    var port = 6080;
                                    var path = 'websockify';
                                    
                                    // Override default settings
                                    var settings = {
                                        host: host,
                                        port: port,
                                        path: path,
                                        encrypt: false,
                                        password: '$password'
                                    };
                                    
                                    // Create the UI
                                    var UI = new RFB(document.getElementById('vncContainer'), 
                                        'ws://' + host + ':' + port + '/' + path,
                                        {
                                            credentials: {
                                                password: '$password'
                                            }
                                        }
                                    );
                                    
                                    // Add connection status
                                    UI.addEventListener('connect', function() {
                                        console.log('Connected to VNC server');
                                    });
                                    
                                    UI.addEventListener('disconnect', function(e) {
                                        console.log('Disconnected: ' + e.detail.reason);
                                    });
                                    
                                    UI.addEventListener('error', function(e) {
                                        console.error('Error: ' + e.detail.reason);
                                    });
                                };
                                document.body.appendChild(script);
                                
                                // Also load CSS
                                var css = document.createElement('link');
                                css.rel = 'stylesheet';
                                css.href = 'app/styles/base.css';
                                document.head.appendChild(css);
                            }
                            
                            // Handle Enter key
                            document.getElementById('password').addEventListener('keydown', function(e) {
                                if (e.key === 'Enter') {
                                    authenticate();
                                }
                            });
                        </script>
                    </body>
                    </html>
                    "@
                    $novncHtml | Out-File -FilePath "C:\web-services\index.html" -Encoding UTF8

                    Write-Host "✅ noVNC installed with authentication"

            - name: Setup noVNC Web Server with Authentication
              env:
                  RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
              run: |
                    # Create simple HTTP server for noVNC
                    $password = $env:RDP_PASSWORD
                    
                    # Create a simple Node.js server that serves noVNC files and handles authentication
                    $serverJs = @'
                    const http = require('http');
                    const fs = require('fs');
                    const path = require('path');
                    const { exec } = require('child_process');
                    
                    const password = fs.readFileSync('C:\\web-services\\password.txt', 'utf8').trim();
                    const webDir = 'C:\\web-services\\novnc';
                    
                    // Start websockify to bridge VNC on port 5900
                    exec('python -m websockify --web=C:\\web-services\\novnc 6080 localhost:5900', (error, stdout, stderr) => {
                        if (error) {
                            console.error(`websockify error: ${error}`);
                            return;
                        }
                        console.log(`websockify output: ${stdout}`);
                    });
                    
                    const server = http.createServer((req, res) => {
                        // Handle authentication
                        if (req.url === '/auth' && req.method === 'POST') {
                            let body = '';
                            req.on('data', chunk => body += chunk);
                            req.on('end', () => {
                                const params = new URLSearchParams(body);
                                if (params.get('password') === password) {
                                    res.writeHead(200);
                                    res.end('OK');
                                } else {
                                    res.writeHead(401);
                                    res.end('Unauthorized');
                                }
                            });
                            return;
                        }
                        
                        // Serve the index.html (our password page) for root
                        if (req.url === '/') {
                            fs.readFile('C:\\web-services\\index.html', (err, data) => {
                                if (err) {
                                    res.writeHead(404);
                                    res.end('File not found');
                                    return;
                                }
                                res.writeHead(200, { 'Content-Type': 'text/html' });
                                res.end(data);
                            });
                            return;
                        }
                        
                        // Serve noVNC files
                        let filePath = path.join(webDir, req.url);
                        // Security: prevent directory traversal
                        if (!filePath.startsWith(webDir)) {
                            res.writeHead(403);
                            res.end('Forbidden');
                            return;
                        }
                        
                        const ext = path.extname(filePath);
                        const contentType = {
                            '.html': 'text/html',
                            '.js': 'application/javascript',
                            '.css': 'text/css',
                            '.png': 'image/png',
                            '.gif': 'image/gif',
                            '.svg': 'image/svg+xml',
                            '.woff': 'font/woff',
                            '.woff2': 'font/woff2',
                            '.ttf': 'font/ttf'
                        }[ext] || 'text/plain';
                        
                        fs.readFile(filePath, (err, data) => {
                            if (err) {
                                res.writeHead(404);
                                res.end('File not found: ' + req.url);
                                return;
                            }
                            res.writeHead(200, { 'Content-Type': contentType });
                            res.end(data);
                        });
                    });
                    
                    server.listen(6080, '0.0.0.0', () => {
                        console.log('noVNC server running on port 6080');
                        console.log('Password required for access');
                    });
                    '@
                    $serverJs | Out-File -FilePath "C:\web-services\server.js" -Encoding ASCII

                    # Start the server
                    Start-Process -FilePath "node" -ArgumentList "C:\web-services\server.js" -WindowStyle Hidden
                    
                    Write-Host "✅ noVNC web server started on port 6080"

            - name: Create SSH Web Interface with Authentication
              env:
                  RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
              run: |
                    # Store RDP password for SSH service
                    $password = $env:RDP_PASSWORD
                    $password | Out-File -FilePath "C:\web-services\sshpassword.txt" -Encoding ASCII

                    # Create SSH web server with authentication
                    $sshWebHtml = @"
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <title>SSH Web Client</title>
                        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/xterm.min.css">
                        <script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/xterm.min.js"></script>
                        <script src="https://cdnjs.cloudflare.com/ajax/libs/xterm-addon-fit/0.8.0/xterm-addon-fit.min.js"></script>
                        <style>
                            body { margin: 0; padding: 20px; background: #1a1a2e; font-family: Arial, sans-serif; }
                            #authForm { max-width: 400px; margin: 100px auto; padding: 30px; background: #16213e; border-radius: 10px; color: #eee; }
                            #terminalContainer { display: none; width: 100vw; height: 100vh; }
                            input { width: 100%; padding: 10px; margin: 10px 0; background: #0f3460; color: #eee; border: none; border-radius: 5px; }
                            button { width: 100%; padding: 10px; background: #e94560; color: white; border: none; border-radius: 5px; cursor: pointer; }
                            button:hover { background: #c73e54; }
                            h2 { text-align: center; }
                            #terminal { height: 90vh; }
                        </style>
                    </head>
                    <body>
                        <div id="authForm">
                            <h2>🔐 SSH Authentication Required</h2>
                            <p>Enter password to access SSH</p>
                            <input type="password" id="sshPassword" placeholder="Enter password" />
                            <button onclick="authenticateSSH()">Connect to SSH</button>
                        </div>
                        <div id="terminalContainer">
                            <div id="terminal"></div>
                        </div>
                        <script>
                            function authenticateSSH() {
                                var password = document.getElementById('sshPassword').value;
                                var xhr = new XMLHttpRequest();
                                xhr.open('POST', '/sshauth', false);
                                xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
                                xhr.send('password=' + encodeURIComponent(password));
                                if (xhr.status === 200) {
                                    document.getElementById('authForm').style.display = 'none';
                                    document.getElementById('terminalContainer').style.display = 'block';
                                    connectSSH();
                                } else {
                                    alert('Invalid password!');
                                }
                            }
                            function connectSSH() {
                                const term = new Terminal();
                                const fitAddon = new FitAddon.FitAddon();
                                term.loadAddon(fitAddon);
                                term.open(document.getElementById('terminal'));
                                fitAddon.fit();
                                term.writeln('\x1b[1;32mConnected to SSH Server\x1b[0m');
                                term.writeln('Type your SSH commands below...');
                                term.writeln('Example: ssh runneradmin@localhost');
                                
                                const ws = new WebSocket('ws://' + window.location.hostname + ':8080/ssh');
                                ws.onopen = function() {
                                    term.writeln('\x1b[1;32mWebSocket connected!\x1b[0m');
                                };
                                ws.onmessage = function(e) {
                                    term.write(e.data);
                                };
                                ws.onerror = function(e) {
                                    term.writeln('\x1b[1;31mWebSocket error\x1b[0m');
                                };
                                ws.onclose = function() {
                                    term.writeln('\x1b[1;31mWebSocket closed\x1b[0m');
                                };
                                
                                term.onData(function(data) {
                                    ws.send(data);
                                });
                            }
                        </script>
                    </body>
                    </html>
                    "@
                    $sshWebHtml | Out-File -FilePath "C:\web-services\ssh.html" -Encoding UTF8

                    Write-Host "✅ SSH Web interface created"

            - name: Setup SSH Web Server with Authentication
              env:
                  RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
              run: |
                    # Create SSH WebSocket server
                    $sshWsServer = @'
                    const WebSocket = require('ws');
                    const http = require('http');
                    const fs = require('fs');
                    const { spawn } = require('child_process');
                    
                    const password = fs.readFileSync('C:\\web-services\\sshpassword.txt', 'utf8').trim();
                    
                    // HTTP server for SSH HTML
                    const httpServer = http.createServer((req, res) => {
                        if (req.url === '/sshauth' && req.method === 'POST') {
                            let body = '';
                            req.on('data', chunk => body += chunk);
                            req.on('end', () => {
                                const params = new URLSearchParams(body);
                                if (params.get('password') === password) {
                                    res.writeHead(200);
                                    res.end('OK');
                                } else {
                                    res.writeHead(401);
                                    res.end('Unauthorized');
                                }
                            });
                            return;
                        }
                        
                        // Serve SSH HTML
                        fs.readFile('C:\\web-services\\ssh.html', (err, data) => {
                            if (err) {
                                res.writeHead(404);
                                res.end('File not found');
                                return;
                            }
                            res.writeHead(200, { 'Content-Type': 'text/html' });
                            res.end(data);
                        });
                    });
                    
                    httpServer.listen(8080, '0.0.0.0', () => {
                        console.log('SSH Web server running on port 8080');
                    });
                    
                    // WebSocket server for SSH
                    const wss = new WebSocket.Server({ port: 8081 });
                    
                    wss.on('connection', (ws) => {
                        console.log('SSH WebSocket connected');
                        let sshProcess = null;
                        
                        ws.on('message', (message) => {
                            const data = message.toString();
                            if (data.startsWith('ssh ')) {
                                // Parse SSH command
                                const parts = data.split(' ');
                                const target = parts[1] || 'localhost';
                                const username = parts[2] || 'runneradmin';
                                
                                if (sshProcess) {
                                    sshProcess.kill();
                                }
                                
                                sshProcess = spawn('ssh', ['-o', 'StrictHostKeyChecking=no', `${username}@${target}`]);
                                
                                sshProcess.stdout.on('data', (data) => {
                                    ws.send(data.toString());
                                });
                                
                                sshProcess.stderr.on('data', (data) => {
                                    ws.send(data.toString());
                                });
                                
                                sshProcess.on('close', (code) => {
                                    ws.send(`\r\nProcess exited with code ${code}\r\n`);
                                    sshProcess = null;
                                });
                            } else if (sshProcess) {
                                sshProcess.stdin.write(data);
                            }
                        });
                        
                        ws.on('close', () => {
                            if (sshProcess) {
                                sshProcess.kill();
                            }
                        });
                    });
                    
                    console.log('SSH WebSocket server running on port 8081');
                    '@
                    $sshWsServer | Out-File -FilePath "C:\web-services\ssh-ws-server.js" -Encoding ASCII

                    # Install ws module
                    npm install -g ws

                    # Start SSH web server
                    Start-Process -FilePath "node" -ArgumentList "C:\web-services\ssh-ws-server.js" -WindowStyle Hidden
                    
                    Write-Host "✅ SSH Web server started on port 8080"

