name: CI-RDP-Linux

on:
    workflow_dispatch:
        inputs:
            install_chrome:
                description: "Install Google Chrome"
                type: boolean
                default: true
            install_vscode:
                description: "Install VS Code"
                type: boolean
                default: true
            install_anydesk:
                description: "Install AnyDesk"
                type: boolean
                default: true
            install_ffmpeg:
                description: "Install FFmpeg"
                type: boolean
                default: true
            install_vlc:
                description: "Install VLC Player"
                type: boolean
                default: true
            install_opencode:
                description: "Install OpenCode AI Agent"
                type: boolean
                default: true
            install_kilocli:
                description: "Install Kilo CLI"
                type: boolean
                default: true
            install_ghostery:
                description: "Install Ghostery Extension for Chrome"
                type: boolean
                default: false
            configure_power:
                description: "Configure Power and Sleep Settings"
                type: boolean
                default: true
            disable_telemetry:
                description: "Disable Telemetry and Services"
                type: boolean
                default: true
            legitimate_use_case:
                description: "Select your legitimate use case"
                type: choice
                options:
                    - "Debugging Linux-specific build failure"
                    - "Testing GUI application in GitHub runner environment"
                    - "Validating complex build scripts interactively"
                    - "Investigating CI/CD pipeline error"
                    - "Other legitimate development purpose"
                default: "Other legitimate development purpose"
                required: false
            use_case_description:
                description: "Briefly describe your debugging scenario (max 200 chars)"
                type: string
                default: "testing"
                required: false

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 9999

        steps:
            - name: Update System and Install Base Packages
              run: |
                    sudo apt-get update
                    sudo apt-get upgrade -y
                    sudo apt-get install -y \
                        wget curl gnupg2 software-properties-common \
                        apt-transport-https ca-certificates \
                        net-tools openssh-server \
                        xorg xfce4 xfce4-goodies \
                        xrdp tightvncserver \
                        dbus-x11 \
                        htop neofetch \
                        unzip

            - name: Create Desktop Directory
              run: |
                    mkdir -p ~/Desktop
                    mkdir -p ~/.local/share/applications
                    echo "✅ Desktop directories created"

            - name: Install Applications (Chrome, VS Code, AnyDesk, FFmpeg, VLC)
              if: inputs.install_chrome || inputs.install_vscode || inputs.install_anydesk || inputs.install_ffmpeg || inputs.install_vlc
              run: |
                    # Install Google Chrome
                    if [ "${{ inputs.install_chrome }}" = "true" ]; then
                        wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
                        sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
                        sudo apt-get update
                        sudo apt-get install -y google-chrome-stable
                        echo "✅ Google Chrome installed"
                    fi

                    # Install VS Code
                    if [ "${{ inputs.install_vscode }}" = "true" ]; then
                        wget -qO- https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > packages.microsoft.gpg
                        sudo install -o root -g root -m 644 packages.microsoft.gpg /etc/apt/trusted.gpg.d/
                        sudo sh -c 'echo "deb [arch=amd64,arm64,armhf signed-by=/etc/apt/trusted.gpg.d/packages.microsoft.gpg] https://packages.microsoft.com/repos/code stable main" > /etc/apt/sources.list.d/vscode.list'
                        sudo apt-get update
                        sudo apt-get install -y code
                        rm -f packages.microsoft.gpg
                        echo "✅ VS Code installed"
                    fi

                    # Install AnyDesk
                    if [ "${{ inputs.install_anydesk }}" = "true" ]; then
                        wget -qO - https://keys.anydesk.com/repos/DEB-GPG-KEY | sudo apt-key add -
                        echo "deb http://deb.anydesk.com/ all main" | sudo tee /etc/apt/sources.list.d/anydesk-stable.list
                        sudo apt-get update
                        sudo apt-get install -y anydesk
                        echo "✅ AnyDesk installed"
                    fi

                    # Install FFmpeg
                    if [ "${{ inputs.install_ffmpeg }}" = "true" ]; then
                        sudo apt-get install -y ffmpeg
                        echo "✅ FFmpeg installed"
                    fi

                    # Install VLC
                    if [ "${{ inputs.install_vlc }}" = "true" ]; then
                        sudo apt-get install -y vlc
                        echo "✅ VLC installed"
                    fi

            - name: Install OpenCode AI
              if: inputs.install_opencode
              run: |
                    # Install npm if not present
                    if ! command -v npm &> /dev/null; then
                        sudo apt-get install -y npm
                    fi
                    sudo npm i -g opencode-ai
                    echo "✅ OpenCode installed"

            - name: Install Kilo CLI
              if: inputs.install_kilocli
              run: |
                    if ! command -v npm &> /dev/null; then
                        sudo apt-get install -y npm
                    fi
                    sudo npm install -g @kilocode/cli
                    echo "✅ Kilo CLI installed"

            - name: Install Ghostery Extension for Chrome
              if: inputs.install_ghostery
              run: |
                    if [ "${{ inputs.install_chrome }}" = "true" ]; then
                        # Install Ghostery extension
                        CHROME_EXTENSION_DIR="$HOME/.config/google-chrome/Default/Extensions"
                        mkdir -p "$CHROME_EXTENSION_DIR"
                        
                        # Download Ghostery CRX
                        wget -O /tmp/ghostery.crx "https://clients2.google.com/service/update2/crx?response=redirect&os=linux&arch=x64&os_arch=x86_64&nacl_arch=x86-64&prod=chromecrx&prodchannel=stable&prodversion=120.0.6099.216&lang=en-US&acceptformat=crx3&x=id%3Dmlomiejdfkolichcflejclcbmpeaniij%26uc"
                        
                        # Extract and install
                        mkdir -p /tmp/ghostery_extract
                        unzip -q /tmp/ghostery.crx -d /tmp/ghostery_extract
                        mkdir -p "$CHROME_EXTENSION_DIR/mlomiejdfkolichcflejclcbmpeaniij"
                        cp -r /tmp/ghostery_extract/* "$CHROME_EXTENSION_DIR/mlomiejdfkolichcflejclcbmpeaniij/"
                        
                        # Cleanup
                        rm -rf /tmp/ghostery.crx /tmp/ghostery_extract
                        echo "✅ Ghostery extension installed"
                    else
                        echo "ℹ️ Chrome not selected for installation, skipping Ghostery"
                    fi

            - name: Configure Desktop Environment (XFCE)
              run: |
                    # Configure XFCE for optimal performance
                    mkdir -p ~/.config/xfce4/xfconf/xfce-perchannel-xml/
                    
                    # Disable compositing for better performance
                    printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
                        '<channel name="xfwm4" version="1.0">' \
                        '    <property name="general" type="empty">' \
                        '        <property name="use_compositing" type="bool" value="false"/>' \
                        '        <property name="theme" type="string" value="Default"/>' \
                        '    </property>' \
                        '</channel>' > ~/.config/xfce4/xfconf/xfce-perchannel-xml/xfwm4.xml
                    
                    # Configure panel
                    printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
                        '<channel name="xfce4-panel" version="1.0">' \
                        '    <property name="panels" type="array">' \
                        '        <value type="int" value="1"/>' \
                        '        <property name="panel-1" type="empty">' \
                        '            <property name="position" type="string" value="p=6;x=0;y=0"/>' \
                        '            <property name="length" type="uint" value="100"/>' \
                        '            <property name="position-locked" type="bool" value="true"/>' \
                        '            <property name="size" type="uint" value="30"/>' \
                        '        </property>' \
                        '    </property>' \
                        '</channel>' > ~/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-panel.xml

            - name: Configure Solid Black Background for XRDP
              run: |
                    # Set solid black background for XFCE
                    mkdir -p ~/.config/xfce4/xfconf/xfce-perchannel-xml/
                    
                    # Configure desktop background to solid black
                    printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
                        '<channel name="xfce4-desktop" version="1.0">' \
                        '    <property name="backdrop" type="empty">' \
                        '        <property name="screen0" type="empty">' \
                        '            <property name="monitor0" type="empty">' \
                        '                <property name="image-path" type="string" value=""/>' \
                        '                <property name="image-style" type="int" value="0"/>' \
                        '                <property name="image-show" type="bool" value="false"/>' \
                        '                <property name="color-style" type="int" value="0"/>' \
                        '                <property name="color1" type="string" value="rgb(0,0,0)"/>' \
                        '                <property name="color2" type="string" value="rgb(0,0,0)"/>' \
                        '            </property>' \
                        '        </property>' \
                        '    </property>' \
                        '    <property name="last" type="empty">' \
                        '        <property name="image" type="string" value=""/>' \
                        '    </property>' \
                        '</channel>' > ~/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-desktop.xml
                    
                    # Also set black background using xfconf-query if available
                    if command -v xfconf-query &> /dev/null; then
                        xfconf-query -c xfce4-desktop -p /backdrop/screen0/monitor0/image-path -s "" 2>/dev/null || true
                        xfconf-query -c xfce4-desktop -p /backdrop/screen0/monitor0/image-show -s "false" 2>/dev/null || true
                        xfconf-query -c xfce4-desktop -p /backdrop/screen0/monitor0/color-style -s "0" 2>/dev/null || true
                        xfconf-query -c xfce4-desktop -p /backdrop/screen0/monitor0/color1 -s "rgb(0,0,0)" 2>/dev/null || true
                        xfconf-query -c xfce4-desktop -p /backdrop/screen0/monitor0/color2 -s "rgb(0,0,0)" 2>/dev/null || true
                    fi
                    
                    # Create a simple solid black XPM file as a fallback
                    mkdir -p ~/.local/share/xfce4/backdrops/
                    cat > ~/.local/share/xfce4/backdrops/black.xpm << 'EOF'
                    /* XPM */
                    static char *black_xpm[] = {
                    "1 1 2 1",
                    "   c None",
                    ".  c #000000",
                    "."
                    };
                    EOF
                    
                    echo "✅ Solid black background configured"

            - name: Configure Power and Sleep Settings
              if: inputs.configure_power
              run: |
                    # Install x11-utils for xset
                    sudo apt-get install -y x11-utils
                    
                    # Disable screensaver
                    gsettings set org.gnome.desktop.screensaver idle-activation-enabled false 2>/dev/null || echo "Screensaver settings skipped"
                    gsettings set org.gnome.desktop.screensaver lock-enabled false 2>/dev/null || echo "Lock settings skipped"
                    
                    # Disable automatic suspend
                    sudo systemctl mask sleep.target suspend.target hibernate.target hybrid-sleep.target 2>/dev/null || echo "Suspend masking skipped"
                    
                    echo "✅ Power and sleep settings configured"

            - name: Disable Telemetry and Unnecessary Services
              if: inputs.disable_telemetry
              run: |
                    # Disable Ubuntu telemetry
                    sudo sed -i 's/ENABLED=1/ENABLED=0/g' /etc/default/ubuntu-report 2>/dev/null || echo "Ubuntu report not found"
                    
                    # Disable apt telemetry
                    sudo apt-get remove -y ubuntu-web-launchers popularity-contest 2>/dev/null || echo "Packages not found"
                    
                    # Stop unnecessary services
                    sudo systemctl stop cups 2>/dev/null || echo "CUPS not running"
                    sudo systemctl disable cups 2>/dev/null || echo "CUPS already disabled"
                    sudo systemctl stop bluetooth 2>/dev/null || echo "Bluetooth not running"
                    sudo systemctl disable bluetooth 2>/dev/null || echo "Bluetooth already disabled"
                    
                    # Disable automatic updates
                    sudo systemctl stop unattended-upgrades 2>/dev/null || echo "Unattended upgrades not running"
                    sudo systemctl disable unattended-upgrades 2>/dev/null || echo "Unattended upgrades already disabled"
                    
                    echo "✅ Telemetry and unnecessary services disabled"

            - name: Setup SSH Server
              run: |
                    sudo systemctl enable ssh
                    sudo systemctl start ssh
                    
                    # Configure SSH for password authentication
                    sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/g' /etc/ssh/sshd_config
                    sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/g' /etc/ssh/sshd_config
                    
                    # Restart SSH service
                    sudo systemctl restart ssh
                    
                    echo "✅ SSH server configured"

            - name: Setup XRDP
              run: |
                    # Configure XRDP to use XFCE
                    echo "startxfce4" > ~/.xsession
                    
                    # Add user to SSL group
                    sudo adduser runner ssl-cert 2>/dev/null || echo "User already in group"
                    
                    # Configure XRDP to use the correct session
                    sudo sed -i 's/^exec.*/exec startxfce4/' /etc/xrdp/xrdp.ini 2>/dev/null || echo "xrdp.ini not found"
                    
                    # Restart XRDP
                    sudo systemctl enable xrdp 2>/dev/null || echo "xrdp enable skipped"
                    sudo systemctl restart xrdp 2>/dev/null || echo "xrdp restart skipped"
                    
                    echo "✅ XRDP configured"

            - name: Download and Install Tailscale
              run: |
                    curl -fsSL https://tailscale.com/install.sh | sh
                    echo "✅ Tailscale installed"

            - name: Start Tailscale
              env:
                  TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
              run: |
                    if [ -z "$TAILSCALE_AUTH_KEY" ]; then
                        echo "❌ TAILSCALE_AUTH_KEY environment variable is not set"
                        exit 1
                    fi
                    sudo tailscale up --auth-key $TAILSCALE_AUTH_KEY
                    echo "✅ Tailscale started"

            - name: Set User Password
              env:
                  RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
              run: |
                    if [ -z "$RDP_PASSWORD" ]; then
                        echo "❌ RDP_PASSWORD environment variable is not set"
                        exit 1
                    fi
                    echo "runner:$RDP_PASSWORD" | sudo chpasswd
                    echo "✅ Password set for user 'runner'"

            - name: Create Self-Destruct Script
              run: |
                    # Ensure Desktop directory exists
                    mkdir -p ~/Desktop
                    
                    cat > ~/Desktop/Stop-VM.sh << 'EOF'
                    #!/bin/bash
                    echo "Creating stop signal and logging out of Tailscale..."
                    touch ~/stopmachine
                    sudo tailscale logout
                    echo "✅ Stop signal created and Tailscale logged out"
                    echo "Machine will shut down within 3 minutes."
                    read -p "Press Enter to exit"
                    EOF
                    chmod +x ~/Desktop/Stop-VM.sh
                    echo "✅ Self-destruct script created"

            - name: Create Desktop Launcher for Applications
              run: |
                    # Create desktop launcher directory if it doesn't exist
                    mkdir -p ~/.local/share/applications
                    
                    # Chrome launcher
                    if [ "${{ inputs.install_chrome }}" = "true" ]; then
                        cat > ~/.local/share/applications/google-chrome.desktop << 'EOF'
                    [Desktop Entry]
                    Version=1.0
                    Name=Google Chrome
                    Comment=Access the Internet
                    Exec=google-chrome-stable %U
                    Icon=google-chrome
                    Terminal=false
                    Type=Application
                    Categories=Network;WebBrowser;
                    EOF
                    fi
                    
                    # VS Code launcher
                    if [ "${{ inputs.install_vscode }}" = "true" ]; then
                        cat > ~/.local/share/applications/code.desktop << 'EOF'
                    [Desktop Entry]
                    Version=1.0
                    Name=VS Code
                    Comment=Code Editing
                    Exec=code %F
                    Icon=code
                    Terminal=false
                    Type=Application
                    Categories=Development;IDE;
                    EOF
                    fi
                    
                    echo "✅ Desktop launchers created"

            - name: Session Activity Logger
              run: |
                    mkdir -p ~/Documents
                    echo "[$(date)] Session started - Use case: ${{ inputs.legitimate_use_case }}" >> ~/Documents/session_activity.log
                    echo "Description: ${{ inputs.use_case_description }}" >> ~/Documents/session_activity.log

            - name: Monitor Services and Keep Alive with Self-Destruct
              env:
                  RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
                  GH_TOKEN: ${{ secrets.YOUR_GITHUB_TOKEN }}
                  GITHUB_TOKEN: ${{ secrets.YOUR_GITHUB_TOKEN }}
              run: |
                    # Fixed session duration: 5 hours 50 minutes = 21000 seconds
                    SESSION_SECONDS=21000
                    
                    # Get Tailscale IP
                    IP=$(tailscale ip -4 2>/dev/null || echo "Tailscale not connected")
                    
                    echo "================================================"
                    echo " ✅ RDP Ready - $IP:3389"
                    echo " ✅ SSH Ready - $IP:22"
                    echo "======================================="
                    echo " Username: runner"
                    echo " Password is set in Repository Secrets"
                    echo " "
                    echo " Connect via SSH: ssh runner@$IP"
                    echo " Connect via RDP: $IP:3389"
                    echo " "
                    echo "======================================="
                    echo "  FOR GITHUB HISTORY LOGGING PURPOSES  "
                    echo " "
                    echo " Legitimate Use Case: ${{ inputs.legitimate_use_case }}"
                    echo " Description: ${{ inputs.use_case_description }}"
                    echo " "
                    echo "======================================="
                    echo " This session will run for 5 hrs 50 mins"
                    echo " Run '~/Desktop/Stop-VM.sh' to stop early"
                    echo "================================================"
                    
                    # Run for 5 hours 50 minutes
                    END_TIME=$((SECONDS + SESSION_SECONDS))
                    LAST_LOG_MINUTE=-1
                    
                    while [ $SECONDS -lt $END_TIME ]; do
                        sleep 180  # Check every 3 minutes
                        
                        # Check for self-destruct signal
                        if [ -f ~/stopmachine ]; then
                            echo "=========================================="
                            echo "🛑 Self-destruct signal detected!"
                            echo "Removing stop file..."
                            rm -f ~/stopmachine
                            break
                        fi
                        
                        # Log remaining time every 5 minutes
                        REMAINING=$(( (END_TIME - SECONDS) / 60 ))
                        CURRENT_MINUTE=$(( (REMAINING / 5) * 5 ))
                        if [ $CURRENT_MINUTE -ne $LAST_LOG_MINUTE ] && [ $REMAINING -gt 0 ]; then
                            LAST_LOG_MINUTE=$CURRENT_MINUTE
                            REMAINING_HOURS=$(( REMAINING / 60 ))
                            REMAINING_MINS=$(( REMAINING % 60 ))
                            echo "$REMAINING_HOURS hours $REMAINING_MINS minutes remaining"
                        fi
                    done
                    
                    echo "=========================================="
                    echo "Session complete - System is shutting down"
                    echo "=========================================="

            - name: Logout Tailscale
              if: always()
              run: |
                    echo "Logging out of Tailscale..."
                    sudo tailscale logout 2>/dev/null || echo "Tailscale logout failed or already logged out"
                    echo "Cleanup completed successfully."
